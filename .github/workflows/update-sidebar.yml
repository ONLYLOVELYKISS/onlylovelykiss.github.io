name: Update Sidebar Navigation with Directory Grouping

on:
  push:
    paths:
      - '**/*'
  pull_request:
    paths:
      - '**/*'

jobs:
  update_sidebar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Scan directories and update sidebar with HTML files
        run: |
          # 1. 找到根目录和子目录中的所有 HTML 文件（排除不必要的目录）
          html_files=$(find . -type f -name "*.html" \
            ! -path './css/*' ! -path './fonts/*' ! -path './img/*' ! -path './js/*' \
            ! -path './.github/*' ! -name 'LICENSE' ! -name 'README.md' ! -name 'index.html')

          # 2. 初始化一个空的字典来存储按目录分组的链接
          declare -A sidebar_links_map

          # 3. 遍历所有找到的 HTML 文件，按目录分组
          for file in $html_files; do
            # 获取文件所在的目录名称
            dir_name=$(dirname "$file")
            # 获取文件名（不带扩展名）
            base_name=$(basename "$file" .html)

            # 将路径格式化为 URL 形式
            # 例如：./docs/xxx/xxx.html -> https://xxx.github.io/docs/xxx/xxx.html
            url="https://onlylovelykiss.github.io${dir_name#./}/$base_name.html"
            
            # 将文件链接添加到对应目录的数组中
            sidebar_links_map[$dir_name]+="<li><a href=\"$url\" class=\"block p-4 rounded-lg text-white text-xl font-medium hover:bg-gray-700/50 transition-colors duration-200\">$base_name</a></li>\n"
          done

          # 4. 为每个目录生成一个包含其 HTML 文件链接的列表
          sidebar_links=""
          for dir in "${!sidebar_links_map[@]}"; do
            # 生成目录标题链接
            dir_name_display=$(basename "$dir")  # 获取目录名称（只显示目录名称）
            sidebar_links+="<li><a href=\"#\" class=\"block p-4 rounded-lg text-white text-xl font-medium hover:bg-gray-700/50 transition-colors duration-200\">$dir_name_display</a>
            <ul class=\"space-y-2 pt-4 pl-6\">${sidebar_links_map[$dir]}</ul></li>\n"
          done

          # 5. 读取现有的 sidebar.html 文件
          sidebar_file="./index.html"  # 修改为您的实际文件路径
          sidebar_content=$(cat $sidebar_file)

          # 6. 替换掉自动生成的部分，插入新生成的 HTML 文件链接
          new_sidebar_content=$(echo "$sidebar_content" | sed "/<!-- AUTO-GENERATED-SIDEBAR -->/,/<!-- END-AUTO-GENERATED-SIDEBAR -->/c\<!-- AUTO-GENERATED-SIDEBAR -->\n$sidebar_links<!-- END-AUTO-GENERATED-SIDEBAR -->")

          # 7. 写回更新后的 sidebar.html 文件
          echo "$new_sidebar_content" > $sidebar_file

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v7
        with:
          author_name: 'ONLYLOVELYKISS'
          author_email: 'onlylovely_kiss@outlook.com'
          message: 'Update sidebar with HTML files grouped by directories'
