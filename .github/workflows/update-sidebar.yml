name: 自动更新侧边栏导航

on:
  push:
    branches: [ masterr ]
    paths-ignore:
      - 'index.html'
      - '.github/workflows/**'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'fonts/**'
      - 'LICENSE'
      - 'README.md'

jobs:
  update-sidebar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt-get install -y tree

      - name: 生成侧边栏内容
        run: |
          EXCLUDE_DIRS=("css" "js" "img" "fonts" ".github" "Toy")
          DIRS=$(find . -maxdepth 1 -type d ! -name "." $(printf "! -name %s " "${EXCLUDE_DIRS[@]}") | sed 's|./||')
          
          SIDEBAR_CONTENT=""
          for dir in $DIRS; do
            TITLE=$(echo "$dir" | sed 's/^./\U&/')
            FILES=$(find "$dir" -name "*.html" | sed 's|./||')
            
            if [ -n "$FILES" ]; then
              SIDEBAR_CONTENT+="
                <li>
                  <a href=\"#\" class=\"block p-4 rounded-lg text-white text-xl font-medium hover:bg-gray-700/50 transition-colors duration-200\">
                    $TITLE
                  </a>
                  <ul class=\"space-y-2 pt-4 pl-6\">"
              
              for file in $FILES; do
                FILENAME=$(basename "$file" .html | sed 's/^./\U&/')
                SIDEBAR_CONTENT+="
                  <li>
                    <a href=\"/$file\" class=\"block p-2 rounded-lg text-gray-200 text-lg hover:bg-gray-700/50 transition-colors duration-200\">
                      $FILENAME
                    </a>
                  </li>"
              done
              
              SIDEBAR_CONTENT+="
                  </ul>
                </li>"
            fi
          done
          
          echo "$SIDEBAR_CONTENT" > sidebar-temp.html

      - name: 更新index.html中的侧边栏
        run: |
          sed -i '/<!-- AUTO-GENERATED-SIDEBAR -->/,/<!-- END-AUTO-GENERATED-SIDEBAR -->/{//!d;}' index.html
          sed -i "/<!-- AUTO-GENERATED-SIDEBAR -->/r sidebar-temp.html" index.html

      # 新增步骤：配置SSH认证（使用Deploy key）
      - name: 配置SSH密钥
        uses: webfactory/ssh-agent@v0.5.4  # 加载SSH密钥的Action
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}  # 引用仓库Secrets中的私钥

      - name: 提交并推送更改
        run: |
          # 配置Git身份
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 将远程仓库地址从HTTPS切换为SSH
          git remote set-url origin git@github.com:ONLYLOVELYKISS/onlylovelykiss.github.io.git
          
          # 检查变更并推送
          git add index.html
          if git diff --staged --quiet; then
            echo "无侧边栏更新，无需提交"
          else
            git commit -m "自动更新侧边栏导航（SSH Deploy key认证）"
            git push origin main  # 通过SSH推送，使用Deploy key认证
          fi
