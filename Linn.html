    <style>
        /* 自定义字体 - 'YourCustomFont'，以提高可读性，并使用 Inter 作为备用字体 */
        @font-face {
            font-family: 'YourCustomFont'; /* 定义你的自定义字体名称 */
            /* URL 指向 GitHub Pages 上的字体文件。使用 'font-display: swap' 以提高性能。 */
            src: url('https://cdn.jsdelivr.net/gh/ONLYLOVELYKISS/onlylovelykiss.github.io@master/fonts/ark-pixel-12px-zh_cn.ttf') format('truetype');
            font-weight: normal; /* 字体粗细 */
            font-style: normal; /* 字体样式 */
            font-display: swap; /* 字体加载策略，在字体加载期间使用备用字体 */
        }

        /* 确保 HTML 元素占据整个视口高度，并设置背景图片 */
        html {
            height: 100%;
            margin: 0;
            padding: 0;
            background-image: url('https://cdn.jsdelivr.net/gh/ONLYLOVELYKISS/onlylovelykiss.github.io@master/img/Back.jpg');
            background-size: cover; /* 确保背景图片覆盖整个元素 */
            background-position: center center; /* 将背景图片居中 */
            background-attachment: fixed; /* 固定背景，不随页面滚动 */
        }

        body {
            font-family: 'YourCustomFont', 'Inter', sans-serif; /* 优先使用自定义字体，如果加载失败则回退到 Inter 或系统无衬线字体 */
            /* min-h-screen (min-height: 100vh) 已通过 Tailwind CSS 类应用于 body 标签 */
            margin: 0; /* 移除默认的 body 边距 */
            padding: 0; /* 移除默认的 body 内边距 */
        }

        /* 定义深色模式的过渡效果，使模式切换更平滑 */
        body.dark {
            /* 修正深色模式下的背景颜色为半透明黑色，使其不覆盖背景图 */
            background-color: rgba(0, 0, 0, 0.5); 
            transition: background-color 0.5s ease; /* 背景颜色过渡 */
        }

        /* 修复白天模式下的背景颜色，确保背景图可见 */
        body:not(.dark) {
            background-color: transparent;
        }
        
        /* 每个部分的背景颜色过渡 */
        .dark .bg-gray-800\/60 {
            transition: background-color 0.5s ease;
            background-color: rgba(255, 255, 255, 0.2); /* 在暗黑模式下，区块背景设置为浅色半透明 */
        }

        /* 各种元素的文本颜色过渡 */
        .dark h1, .dark h2, .dark p, .dark a, .dark footer {
            transition: color 0.5s ease;
        }

        /* 标题字体颜色 - 恢复为默认或 Tailwind 颜色 */
        h1 {
            background-image: none; /* 移除渐变相关样式 */
            -webkit-background-clip: unset;
            -webkit-text-fill-color: unset;
            color: #1a202c; /* 默认深色文本颜色，类似于 Tailwind 的 text-gray-900 */
        }

        /* 深色模式下 h1 的颜色 */
        .dark h1 {
            color: #f7fafc; /* 深色模式下浅色文本颜色，类似于 Tailwind 的 text-white */
        }

        /* 鼠标点击效果样式 */
        .click-effect {
            position: absolute;
            pointer-events: none; /* 确保它不干扰鼠标事件 */
            font-size: 1.5em; /* 较小的心形大小 */
            opacity: 1;
            transform: translate(-50%, -200%); /* 居中于点击点 */
            transition: all 0.6s ease-out; /* 动画效果 */
            z-index: 9999; /* 确保它在最上层 */
        }
        .click-effect.fade-out {
            opacity: 0;
            transform: translate(-50%, -150px) scale(0.5);/* 向上移动并淡出 */
        }

        /* 搜索输入框为空时的提示样式 */
        .error-message {
            color: #ef4444; /* Tailwind red-500 */
            font-size: 0.875rem; /* text-sm */
            margin-top: 0.5rem; /* mt-2 */
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .error-message.show {
            opacity: 1;
        }
    </style>

    <script>
        // 获取搜索输入框、按钮和错误消息元素的 DOM 引用
        const searchInput = document.getElementById('search-input');
        const googleSearchBtn = document.getElementById('google-search-btn');
        const baiduSearchBtn = document.getElementById('baidu-search-btn');
        const searchErrorMessage = document.getElementById('search-error-message');

        /**
         * 显示搜索错误消息。
         */
        function showSearchError() {
            searchErrorMessage.classList.add('show');
            // 2秒后自动隐藏错误消息
            setTimeout(() => {
                searchErrorMessage.classList.remove('show');
            }, 2000);
        }

        /**
         * 执行搜索操作。
         * @param {string} searchEngine - 搜索引擎名称 ('google' 或 'baidu')。
         */
        function performSearch(searchEngine) {
            const query = searchInput.value.trim(); // 获取输入框内容并去除首尾空格
            if (query) { // 如果输入内容不为空
                let url;
                if (searchEngine === 'google') {
                    // 构建谷歌搜索 URL，使用 encodeURIComponent 对查询字符串进行编码以处理特殊字符
                    url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                } else if (searchEngine === 'baidu') {
                    // 构建百度搜索 URL，使用 encodeURIComponent 对查询字符串进行编码
                    url = `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`;
                }
                window.open(url, '_blank'); // 在新标签页打开搜索结果
            } else {
                showSearchError(); // 如果输入为空，显示错误消息
            }
        }

        // 谷歌搜索功能实现
        googleSearchBtn.addEventListener('click', () => performSearch('google'));

        // 百度搜索功能实现
        baiduSearchBtn.addEventListener('click', () => performSearch('baidu'));

        // 允许在搜索输入框中按回车键进行谷歌搜索
        searchInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') { // 如果按下的键是“Enter”
                performSearch('google'); // 模拟点击谷歌搜索按钮
            }
        });

        // 禁用右键默认菜单并跳转到指定网页
        document.addEventListener('contextmenu', (event) => {
            event.preventDefault(); // 阻止默认的右键菜单
            window.location.href = 'https://www.gov.cn/'; // 跳转到指定网址
        });

        // 加密函数：每次调用都会生成一个新的随机密钥
        async function encryptData(data) {
            // 使用AES-GCM算法生成一个256位的随机密钥
            const key = await window.crypto.subtle.generateKey(
                { name: "AES-GCM", length: 256 },
                true,
                ["encrypt", "decrypt"]
            );

            // 生成一个12字节的随机初始化向量（IV）
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoder = new TextEncoder();
            const encodedData = encoder.encode(JSON.stringify(data));

            // 使用生成的密钥和IV进行加密
            const encrypted = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                key,
                encodedData
            );

            // 导出密钥，以便后续解密（在实际应用中，密钥会安全地传输到服务器）
            const exportedKey = await window.crypto.subtle.exportKey("jwk", key);
            
            // 返回加密后的数据、IV和密钥
            // 在此，我们不将任何信息输出到控制台，以增强安全性
            return {
                encryptedData: btoa(String.fromCharCode(...new Uint8Array(encrypted))),
                iv: btoa(String.fromCharCode(...iv)),
                key: JSON.stringify(exportedKey)
            };
        }

        /**
         * 检查当前时间是否在日出和日落之间。
         * @param {Date} now - 当前时间对象。
         * @param {string} sunriseUtc - 日出时间 (UTC)。
         * @param {string} sunsetUtc - 日落时间 (UTC)。
         * @returns {boolean} - 如果是白天，返回 true。
         */
        function isDaytime(now, sunriseUtc, sunsetUtc) {
            const sunriseTime = new Date(now.toDateString() + ' ' + sunriseUtc);
            const sunsetTime = new Date(now.toDateString() + ' ' + sunsetUtc);
            
            // 处理日出日落跨天的情况，例如日出在今天，日落在明天
            if (sunsetTime < sunriseTime) {
                if (now < sunriseTime) {
                    sunriseTime.setDate(sunriseTime.getDate() - 1);
                } else {
                    sunsetTime.setDate(sunsetTime.getDate() + 1);
                }
            }
            
            return now >= sunriseTime && now < sunsetTime;
        }

        /**
         * 根据日出日落时间应用主题。
         */
        async function applyThemeBasedOnSunTimes() {
            const now = new Date();
            let isDarkMode = false; // 默认是浅色模式

            try {
                // 获取地理位置
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
                });

                const { latitude, longitude } = position.coords;
                // 对位置信息进行加密，但不将结果输出到控制台
                await encryptData({ latitude, longitude });

                // 获取日出日落时间
                const response = await fetch(`https://api.sunrise-sunset.org/json?lat=${latitude}&lng=${longitude}&formatted=0`);
                const data = await response.json();

                if (data.status === 'OK') {
                    const sunriseUtc = data.results.sunrise;
                    const sunsetUtc = data.results.sunset;
                    
                    if (!isDaytime(now, sunriseUtc, sunsetUtc)) {
                        isDarkMode = true;
                        // 不在控制台输出敏感信息
                    } else {
                        // 不在控制台输出敏感信息
                    }
                } else {
                    isDarkMode = applyFallbackTheme();
                }

            } catch (error) {
                isDarkMode = applyFallbackTheme();
            }

            const body = document.body;
            if (isDarkMode) {
                body.classList.add('dark');
            } else {
                body.classList.remove('dark');
            }
        }

        /**
         * 回退到基于北京时间的默认主题模式。
         * @returns {boolean} - 是否为暗黑模式。
         */
        function applyFallbackTheme() {
            const now = new Date();
            let beijingHour;
            try {
                const options = {
                    hour: 'numeric',
                    hourCycle: 'h23',
                    timeZone: 'Asia/Shanghai'
                };
                beijingHour = parseInt(now.toLocaleString('en-US', options));
            } catch (e) {
                beijingHour = now.getHours();
            }

            const isDaytimeByHour = beijingHour >= 6 && beijingHour < 18;
            return !isDaytimeByHour;
        }

        // 页面加载完成后立即应用主题
        document.addEventListener('DOMContentLoaded', applyThemeBasedOnSunTimes);
        // 每小时更新一次主题，确保日出日落时间变化时模式能及时切换
        setInterval(applyThemeBasedOnSunTimes, 60 * 60 * 1000); // 60分钟（1小时）更新一次

        // 鼠标点击效果 JavaScript
        document.body.addEventListener('click', (event) => {
            const heart = document.createElement('span');
            heart.textContent = '❤️';
            heart.classList.add('click-effect');
            heart.style.left = `${event.clientX}px`;
            heart.style.top = `${event.clientY}px`;
            document.body.appendChild(heart);

            // 触发动画
            setTimeout(() => {
                heart.classList.add('fade-out');
            }, 10); // 短暂延迟以确保 CSS 过渡生效

            // 动画结束后移除元素
            heart.addEventListener('transitionend', () => {
                heart.remove();
            });
        });
    </script>
</body>
