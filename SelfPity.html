<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自我感动是病态😢</title>
  <!-- 引入外部资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义颜色和字体 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e9446a',
            lovePink: '#ff8fa3',
            loveBlue: '#8ea8de',
            lovePurple: '#c084fc',
            loveYellow: '#fde68a',
            loveGreen: '#a7f3d0',
            loveCoral: '#fecdd3',
            loveLavender: '#e0e7ff',
            loveMint: '#d1fae5',
            lovePeach: '#fee2e2',
            loveSage: '#dbeafe',
          },
          fontFamily: {
            romantic: ['Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      /* 液态玻璃效果核心样式 */
      .liquid-glass {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        will-change: transform, opacity, box-shadow; /* 优化动画准备 */
        transition: all 0.5s ease;
      }
      
      /* 卡片悬停效果 - 使用transform替代top等属性 */
      .card-hover {
        transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                    box-shadow 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                    backdrop-filter 0.5s ease;
      }
      
      .card-hover:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.25);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
      }
      
      /* 背景渐变动画 */
      .bg-animate {
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
      }
      
      @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      /* 卡片弹出动画 - 仅使用transform和opacity */
      @keyframes popIn {
        0% { 
          opacity: 0;
          transform: scale(0.8) translateY(20px);
        }
        100% { 
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      
      .pop-in {
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      /* 卡片色彩过渡动画 */
      .color-transition {
        background-size: 200% 200%;
        animation: colorShift 10s ease infinite;
      }
      
      @keyframes colorShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50 bg-animate font-romantic overflow-x-hidden">
  
  <!-- 卡片容器 - 使用相对定位避免频繁重排 -->
  <main class="relative px-4 pb-24 pt-4 md:pt-8 h-screen overflow-hidden">
    <!-- 卡片会通过JS动态添加到这里 -->
  </main>
  
  <!-- 控制按钮 - 固定定位减少布局影响 -->
  <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 flex flex-wrap justify-center gap-3 px-4 z-50 pointer-events-auto">
    <button id="addCard" class="liquid-glass px-5 py-3 rounded-full text-white bg-primary hover:bg-primary/90 transition-all flex items-center gap-2 min-w-[140px] justify-center">
      <i class="fa fa-heart"></i> 再添一句
    </button>
    <button id="clearCards" class="liquid-glass px-5 py-3 rounded-full text-gray-700 hover:bg-white/70 transition-all flex items-center gap-2 min-w-[140px] justify-center">
      <i class="fa fa-trash"></i> 清空
    </button>
  </div>

  <script>
    // 数据缓存与复用
    const loveMessages = [
      "有你在身边，连空气都是甜的。",
      "不管发生什么，我都会紧紧牵着你的手。",
      "你的笑容，是我每天醒来的动力。",
      "和你在一起的每一刻，都值得被珍藏。",
      "谢谢你包容我的一切，包括我的小脾气。",
      "想到未来有你，就对生活充满了期待。",
      "即使沉默不语，只要你在身边就很安心。",
      "你是我疲惫生活里的英雄梦想。",
      "遇见你之后，我才明白什么是真正的幸福。",
      "无论顺境逆境，我都会是你最坚实的后盾。",
      "每天睡前想到的是你，醒来第一眼想看到的也是你。",
      "你的拥抱，是治愈我所有不安的良药。",
      "和你在一起，平凡的日子也变得闪闪发光。",
      "我爱你，不是因为你是谁，而是因为和你在一起时我是谁。",
      "谢谢你出现在我的生命里，像一道光照亮了我。",
      "就算我们老得走不动了，我依然会像现在这样爱着你。",
      "你理解我的奇奇怪怪，也陪我一起可可爱爱。",
      "有你在，我什么都不怕。",
      "你是我这辈子最正确的决定。",
      "就算世界再大，我的眼里也只有你。"
    ];
    
    const cardColors = [
      'from-lovePink/15 to-loveCoral/20', 'from-loveCoral/15 to-pink-100/20',
      'from-pink-100/15 to-lovePeach/20', 'from-loveBlue/15 to-blue-100/20',
      'from-blue-100/15 to-loveSage/20', 'from-loveSage/15 to-cyan-100/20',
      'from-lovePurple/15 to-loveLavender/20', 'from-loveLavender/15 to-purple-100/20',
      'from-purple-100/15 to-indigo-100/20', 'from-loveYellow/15 to-yellow-100/20',
      'from-yellow-100/15 to-amber-100/20', 'from-amber-100/15 to-orange-100/20',
      'from-loveGreen/15 to-loveMint/20', 'from-loveMint/15 to-green-100/20',
      'from-green-100/15 to-teal-100/20', 'from-lovePink/15 to-lovePurple/15',
      'from-loveBlue/15 to-lovePurple/15', 'from-loveGreen/15 to-loveBlue/15',
      'from-loveYellow/15 to-lovePink/15', 'from-lovePeach/15 to-loveLavender/15'
    ];
    
    const icons = [
      'fa-heart', 'fa-heartbeat', 'fa-star', 'fa-diamond', 
      'fa-moon-o', 'fa-sun-o', 'fa-rose', 'fa-gift',
      'fa-kiss-wink-heart', 'fa-hands-holding-heart',
      'fa-heart-pulse', 'fa-heart-circle-plus', 'fa-heart-crack'
    ];
    
    // DOM 引用缓存
    const mainContainer = document.querySelector('main');
    const addCardBtn = document.getElementById('addCard');
    const clearCardsBtn = document.getElementById('clearCards');
    
    // 性能优化：缓存屏幕尺寸，减少DOM查询
    let screenWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    let screenHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
    let isMobile = screenWidth < 768;
    
    // 限制最大卡片数量，防止性能下降
    const MAX_CARDS = 50;
    let cardCount = 0;
    
    // 工具函数
    function getRandomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    
    function getRandomMessage() {
      return loveMessages[getRandomNumber(0, loveMessages.length - 1)];
    }
    
    // 使用文档片段减少DOM重绘
    const documentFragment = document.createDocumentFragment();
    
    // 创建卡片元素 - 优化版
    function createCard() {
      if (cardCount >= MAX_CARDS) return null; // 控制最大数量
      
      const card = document.createElement('div');
      
      // 随机属性
      const randomColor = cardColors[getRandomNumber(0, cardColors.length - 1)];
      const randomIcon = icons[getRandomNumber(0, icons.length - 1)];
      const randomRotation = getRandomNumber(-3, 3);
      const randomDelay = Math.random() * 0.5;
      const hueRotate = getRandomNumber(0, 360);
      
      // 响应式样式
      const cardPadding = isMobile ? 'p-4' : 'p-6';
      const cardMaxWidth = isMobile ? 'max-w-[85vw]' : 'max-w-md';
      const textSize = isMobile ? 'text-base' : 'text-lg';
      
      // 设置卡片样式 - 优先使用transform和opacity动画
      card.className = `liquid-glass pop-in rounded-2xl ${cardPadding} ${cardMaxWidth} mx-auto mb-6 relative card-hover color-transition`;
      card.style.transform = `rotate(${randomRotation}deg)`;
      card.style.animationDelay = `${randomDelay}s`;
      card.style.backgroundImage = `linear-gradient(135deg, ${randomColor})`;
      card.style.filter = `hue-rotate(${hueRotate}deg)`;
      
      // 设置卡片内容
      card.innerHTML = `
        <div class="absolute -top-3 -right-3 text-primary/80 text-2xl transition-colors duration-700">
          <i class="fa ${randomIcon}"></i>
        </div>
        <p class="text-gray-700 ${textSize} leading-relaxed italic transition-colors duration-700">${getRandomMessage()}</p>
      `;
      
      cardCount++;
      return card;
    }
    
    // 添加卡片到页面 - 使用requestAnimationFrame优化动画
    function addCard() {
      const card = createCard();
      if (!card) return;
      
      // 卡片尺寸计算（只计算一次）
      const cardWidth = isMobile ? screenWidth * 0.85 : 300;
      const cardHeight = isMobile ? 120 : 150;
      
      // 随机起始位置
      const startPosX = getRandomNumber(-50, screenWidth + 50);
      const startPosY = getRandomNumber(-50, screenHeight + 50);
      
      // 初始样式（离线修改，减少重排）
      card.style.position = 'absolute';
      card.style.left = `${startPosX}px`;
      card.style.top = `${startPosY}px`;
      card.style.opacity = '0';
      
      // 先添加到文档片段，再一次性插入DOM
      documentFragment.appendChild(card);
      mainContainer.appendChild(documentFragment);
      
      // 计算最终位置
      const finalPosX = getRandomNumber(10, screenWidth - cardWidth - 10);
      const finalPosY = getRandomNumber(
        isMobile ? 40 : 50, 
        screenHeight - cardHeight - (isMobile ? 120 : 100)
      );
      
      // 使用requestAnimationFrame确保动画同步浏览器刷新
      requestAnimationFrame(() => {
        card.style.transition = 'all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        card.style.left = `${finalPosX}px`;
        card.style.top = `${finalPosY}px`;
        card.style.opacity = '1';
      });
    }
    
    // 初始添加卡片
    function initCards() {
      const initialCount = isMobile ? getRandomNumber(5, 8) : getRandomNumber(8, 12);
      
      // 使用requestAnimationFrame分批添加，避免阻塞
      const addCardBatch = (count) => {
        if (count <= 0) return;
        addCard();
        requestAnimationFrame(() => addCardBatch(count - 1));
      };
      
      addCardBatch(initialCount);
    }
    
    // 清空所有卡片 - 优化动画性能
    function clearCards() {
      const cards = document.querySelectorAll('.liquid-glass.rounded-2xl');
      if (!cards.length) return;
      
      // 批量处理动画
      cards.forEach((card, index) => {
        setTimeout(() => {
          // 只动画transform和opacity属性
          card.style.transition = 'transform 0.5s ease, opacity 0.5s ease';
          card.style.opacity = '0';
          card.style.transform = 'scale(0.8) rotate(0deg)';
          
          // 动画结束后移除
          setTimeout(() => {
            card.remove();
            cardCount--;
          }, 500);
        }, index * 100);
      });
    }
    
    // 窗口大小变化处理 - 节流优化
    let resizeTimeout;
    function handleResize() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        // 只在尺寸确实变化时执行
        const newWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        const newHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
        
        if (newWidth === screenWidth && newHeight === screenHeight) return;
        
        screenWidth = newWidth;
        screenHeight = newHeight;
        isMobile = screenWidth < 768;
        
        // 重新定位卡片
        const cards = document.querySelectorAll('.liquid-glass.rounded-2xl');
        const cardWidth = isMobile ? screenWidth * 0.85 : 300;
        const cardHeight = isMobile ? 120 : 150;
        
        // 使用requestAnimationFrame优化重排
        requestAnimationFrame(() => {
          cards.forEach(card => {
            const finalPosX = getRandomNumber(10, screenWidth - cardWidth - 10);
            const finalPosY = getRandomNumber(
              isMobile ? 40 : 50, 
              screenHeight - cardHeight - (isMobile ? 120 : 100)
            );
            
            card.style.left = `${finalPosX}px`;
            card.style.top = `${finalPosY}px`;
          });
        });
      }, 100); // 节流延迟
    }
    
    // 事件监听优化
    addCardBtn.addEventListener('click', addCard);
    clearCardsBtn.addEventListener('click', clearCards);
    window.addEventListener('load', initCards);
    window.addEventListener('resize', handleResize);
    
    // 自动添加卡片 - 优化定时器性能
    const intervalTime = isMobile ? 2000 : 1500;
    let autoAddInterval;
    
    function startAutoAdd() {
      autoAddInterval = setInterval(() => {
        // 控制添加频率，避免过多卡片
        if (cardCount >= MAX_CARDS) return;
        
        const probability = isMobile ? 0.7 : 0.8;
        if (Math.random() > (1 - probability)) {
          requestAnimationFrame(addCard); // 使用requestAnimationFrame包装
          
          if (Math.random() > 0.7 && cardCount < MAX_CARDS - 1) {
            setTimeout(() => requestAnimationFrame(addCard), 500);
          }
        }
      }, intervalTime);
    }
    
    // 页面可见性变化时暂停/恢复自动添加
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(autoAddInterval);
      } else {
        startAutoAdd();
      }
    });
    
    // 启动自动添加
    startAutoAdd();
  </script>
</body>
</html>
